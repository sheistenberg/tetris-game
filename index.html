<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tetris</h1>
    <div id="game-container">
        <canvas id="game-canvas" width="240" height="400"></canvas>
        <div id="sidebar">
            <div>Score: <span id="score">0</span></div>
            <div>Lines: <span id="lines">0</span></div>
            <div>Level: <span id="level">1</span></div>
            <button id="start-btn">Start</button>
            <button id="controls-btn" type="button" class="sidebar-secondary-btn">Controls</button>
            <div id="next-piece-label">Next:</div>
            <canvas id="next-canvas" width="96" height="96"></canvas>
            <div id="hold-piece-label">Hold:</div>
            <canvas id="hold-canvas" width="96" height="96"></canvas>
            <div id="high-score-row">High: <span id="high-score">0</span></div>
        </div>
    </div>
    <div id="mobile-controls">
        <div class="control-row">
            <button class="control-btn" data-action="left" aria-label="Move left">&#9664;</button>
            <button class="control-btn" data-action="rotate" aria-label="Rotate">&#8635;</button>
            <button class="control-btn" data-action="right" aria-label="Move right">&#9654;</button>
        </div>
        <div class="control-row">
            <button class="control-btn" data-action="down" aria-label="Soft drop">&#9660;</button>
            <button class="control-btn" data-action="hard-drop" aria-label="Hard drop">&#10515;</button>
        </div>
        <div class="control-row">
            <button class="control-btn" data-action="hold" aria-label="Hold">H</button>
            <button class="control-btn" data-action="pause" aria-label="Pause">II</button>
        </div>
    </div>
    <div id="game-over" hidden>
        <div id="game-over-panel">
            <h2>Game Over</h2>
            <div>Score: <span id="final-score">0</span></div>
            <div>High: <span id="final-high">0</span></div>
            <button id="restart-btn">Restart</button>
        </div>
    </div>
    <div id="paused" hidden>
        <div id="paused-panel">Paused</div>
    </div>
    <div id="controls" hidden>
        <div id="controls-panel" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="controls-title">
            <h2 id="controls-title">Controls</h2>
            <table class="controls-table">
                <thead>
                    <tr><th scope="col">Action</th><th scope="col">Key</th></tr>
                </thead>
                <tbody>
                    <tr><td>Move left</td><td class="controls-key">&larr;</td></tr>
                    <tr><td>Move right</td><td class="controls-key">&rarr;</td></tr>
                    <tr><td>Soft drop</td><td class="controls-key">&darr;</td></tr>
                    <tr><td>Rotate</td><td class="controls-key">&uarr;</td></tr>
                    <tr><td>Hard drop</td><td class="controls-key">Space</td></tr>
                    <tr><td>Hold</td><td class="controls-key">C</td></tr>
                    <tr><td>Pause / Resume</td><td class="controls-key">P</td></tr>
                </tbody>
            </table>
            <button id="controls-close-btn" type="button">Close</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
